<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Test</title>
</head>
<body>
    <form id="myform">
        <div id="globalErrors"></div>
        <div id="firstNameContainer">
            <label for="">First name: 
                <input id="firstName" name="firstName" minlength="5" maxlength="50">
            </label>
            <div id="firstNameError"></div>
        </div>
        <button>Submit</button>
    </form>
</body>
<script>
    const myForm = document.getElementById("myForm")
    const firstNameInput = document.getElementById("firstName")
    const firstNameError = document.getElementById("firstNameError")

    function validateFirstName(){
        if(!firstNameInput.validity.valid) {
            firstNameError.innerHTML = `<p>Name is not 5-50 charaters</p>`
            return false
        }
        return true
    }

    firstNameInput.addEventListener("blur", validateFirstName)
    // () => {
    //     validateFirstName()
    // })

    myForm.addEventListener("submit", (event) => {
        event.preventDefault()

        if(!validateFirstName()){
            document.getElementById("globalErrors").innerHTML = `<p>Correct errors before submitting</p>`
            return
        }
        event.submit()
    })
</script>
</html>
